<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .banner {
      width: 1084px;
      height: 576px;
      background: linear-gradient(135deg, #0a0a0a 0%, #111111 50%, #0a0a0a 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dot-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.12) 1px, transparent 1px);
      background-size: 18px 18px;
    }
    .glow-1 {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.08), transparent 70%);
      top: -150px;
      left: 10%;
    }
    .glow-2 {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.06), transparent 70%);
      bottom: -100px;
      right: 15%;
    }
    .content {
      position: relative;
      text-align: center;
      max-width: 900px;
    }
    .label {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #38bdf8;
      margin-bottom: 20px;
    }
    h1 {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      font-size: 68px;
      font-weight: 700;
      letter-spacing: -3px;
      color: #fff;
      line-height: 1.1;
    }
    h1 span {
      background: linear-gradient(135deg, #38bdf8, #22d3ee, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sub {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      font-size: 24px;
      color: rgba(255,255,255,0.5);
      margin-top: 20px;
      letter-spacing: -0.3px;
    }
    .border-line {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.2), transparent);
    }
    .border-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.1), transparent);
    }
    .tags {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 28px;
    }
    .tag {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.15);
      padding: 8px 18px;
      border-radius: 50px;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="dot-grid"></div>
    <div class="glow-1"></div>
    <div class="glow-2"></div>
    <div class="border-top"></div>
    <div class="content">
      <div class="label">App Mastery</div>
      <h1>De Zéro à une <span>App Rentable</span><br>sur l'App Store en 28 Jours</h1>
      <div class="sub">La méthode complète pour créer, lancer et monétiser ton app avec l'IA.</div>
      <div class="tags">
        <span class="tag">Vibe Coding IA</span>
        <span class="tag">Marketing Viral</span>
        <span class="tag">Monétisation</span>
        <span class="tag">Communauté Privée</span>
      </div>
    </div>
    <div class="border-line"></div>
  </div>
</body>
</html>
